            <stop offset="100%" stop-color="#6B57FF"/>
        </linearGradient>
    </defs>

    <!-- 2. 圆形渐变底座 -->
    <circle cx="20" cy="20" r="19" fill="url(#bg_gradient)"/>

    <!-- 3. 左侧：Android 机器人 (垂直靠左) -->
