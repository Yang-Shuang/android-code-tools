        <rect x="10" y="8" width="1.6" height="4" rx="0.8" transform="rotate(-25 10 8)"/>
        <rect x="16.4" y="7.3" width="1.6" height="4" rx="0.8" transform="rotate(25 16.4 7.3)"/>

